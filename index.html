  <div id="loader" class="loader-screen" aria-hidden="true">
    <div class="loader-card">
      <div class="loader-logo-wrap"><img src="assets/aura-logo.png" alt="AURA"></div>
      <div class="loader-wordmark">AURA MENU</div>
      <div class="loader-line"><span></span></div>
      <div class="loader-caption">Preparing your menu</div>
    </div>
  </div>

  <div id="app" class="site hidden">
    <header class="topbar">
      <a class="brand-lockup" href="#top" aria-label="AURA MENU">
        <img src="assets/aura-logo.png" alt="AURA logo">
        <span>AURA MENU</span>
      </a>
      <a class="location-pill" id="locationBtn" href="#" target="_blank" rel="noopener">
        <svg><use href="#i-pin"></use></svg>
        <span>الموقع</span>
      </a>
    </header>

    <main id="top">
      <section class="hero container">
        <div class="hero-copy">
          <div class="eyebrow">AURA CAFE</div>
          <h1 id="brandTitle">AURA MENU</h1>
          <p id="tagline">Coffee • Drinks • Desserts</p>
          <p class="hero-sub" id="subtagline">اتفرّج على المنيو واختار طلبك، وبلّغ الويتر بطلبك.</p>
          <div class="social-row" id="socialRow"></div>
        </div>
        <div class="hero-mark">
          <span class="mark-glow"></span>
          <img src="assets/aura-logo.png" alt="AURA">
        </div>
      </section>

      <section class="menu-shell container">
        <div class="toolbar glass-card">
          <div class="search-box">
            <svg><use href="#i-search"></use></svg>
            <input id="searchInput" type="search" placeholder="دور على مشروب أو حلو…" autocomplete="off">
          </div>
          <div id="categoryNav" class="category-nav" role="tablist" aria-label="تصنيفات المنيو"></div>
        </div>

        <div class="section-head">
          <div>
            <div class="section-kicker">MENU</div>
            <h2>اختار اللي على مزاجك</h2>
          </div>
          <div class="result-count" id="resultCount"></div>
        </div>

        <div id="menuContent" class="menu-content"></div>
        <div id="emptyState" class="empty-state hidden">مفيش نتائج مطابقة لبحثك.</div>
      </section>
    </main>

    <footer class="footer container">
      <div class="footer-brand">
        <img src="assets/aura-logo.png" alt="AURA logo">
        <div>
          <strong>AURA MENU</strong>
          <span>Scan • Browse</span>
        </div>
      </div>
      <div class="footer-links" id="footerLinks"></div>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/menu-data.js"></script>
  <script src="app.js"></script>
